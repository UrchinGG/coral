name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      clients:
        description: Rebuild what depends on the clients crate
        type: boolean
        default: false
      everything:
        description: Rebuild and redeploy every service
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: infra-vm:5000
  VM: debian@coral-vm.tailde25ae.ts.net

jobs:
  changes:
    runs-on: [self-hosted, linux, coral]
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      packages: ${{ steps.affected.outputs.packages }}
      services: ${{ steps.affected.outputs.services }}
      admin_panel: ${{ steps.affected.outputs.admin_panel }}
      coral_web: ${{ steps.affected.outputs.coral_web }}
      deploy: ${{ steps.affected.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Find the last push that passed
        id: passed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
            | python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print("sha=" + (runs[0]["head_sha"] if runs else ""))' \
            | tee -a "$GITHUB_OUTPUT"
      - id: affected
        run: python3 .github/affected.py "$BASE" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.passed.outputs.sha || github.event.before }}
          CLIENTS: ${{ inputs.clients }}
          EVERYTHING: ${{ inputs.everything }}

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, coral]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, coral]
    env:
      CARGO_TARGET_DIR: /srv/ci/coral/clippy
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: mkdir -p crates/coral-admin/ui/dist
      - run: cargo clippy --all-targets $(printf -- '-p %s ' $PACKAGES)

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, linux, coral]
    env:
      CARGO_TARGET_DIR: /srv/ci/coral/test
      PACKAGES: ${{ needs.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        if: contains(env.PACKAGES, 'coral-admin')
        with:
          node-version: 22
      - name: Build the admin panel that coral-admin's tests serve
        if: contains(env.PACKAGES, 'coral-admin')
        working-directory: crates/coral-admin/ui
        run: npm ci && npm run build
      - run: mkdir -p crates/coral-admin/ui/dist
      - run: cargo test $(printf -- '-p %s ' $PACKAGES)

  admin-panel:
    needs: changes
    if: needs.changes.outputs.admin_panel == 'true'
    runs-on: [self-hosted, linux, coral]
    defaults:
      run:
        working-directory: crates/coral-admin/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  coral-web:
    needs: changes
    if: needs.changes.outputs.coral_web == 'true'
    runs-on: [self-hosted, linux, coral]
    defaults:
      run:
        working-directory: coral-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  images:
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      && (needs.changes.outputs.services != '' || needs.changes.outputs.coral_web == 'true')
    runs-on: [self-hosted, linux, coral]
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - name: Run this runner's build hook, if it has one
        run: '[ -z "${BUILD_HOOK:-}" ] || "$BUILD_HOOK"'
      - id: targets
        run: echo "targets=$SERVICES${{ needs.changes.outputs.coral_web == 'true' && ' coral-web' || '' }}" | tee -a "$GITHUB_OUTPUT"
      - name: Build and push
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          for target in $TARGETS; do
            docker build --target "$target" \
              --build-arg BINS="$SERVICES" \
              --tag "$REGISTRY/$target:latest" \
              --tag "$REGISTRY/$target:$GITHUB_SHA" .
            docker push --all-tags "$REGISTRY/$target"
          done

  deploy:
    needs: [changes, fmt, clippy, test, admin-panel, coral-web, images]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      && (needs.images.result == 'success' || needs.changes.outputs.deploy == 'true')
    runs-on: [self-hosted, linux, coral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Trust coral-vm's host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R coral-vm.tailde25ae.ts.net 2>/dev/null || true
          ssh-keyscan -H coral-vm.tailde25ae.ts.net >> ~/.ssh/known_hosts

      - name: Copy deploy files
        run: rsync -a --delete deploy/ "$VM:coral-r730/deploy/"

      - name: Roll out
        env:
          TARGETS: ${{ needs.images.outputs.targets }}
        run: ssh "$VM" bash coral-r730/deploy/rollout.sh $TARGETS

      - name: Check api.urchin.gg
        if: contains(needs.images.outputs.targets, 'coral-api')
        run: |
          for attempt in $(seq 12); do
            curl -fsS --max-time 10 https://api.urchin.gg/health | grep -q '"status":"healthy"' && exit 0
            sleep 5
          done
          echo "api.urchin.gg did not report healthy within a minute" >&2
          exit 1
