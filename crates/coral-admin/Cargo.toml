[package]
name = "coral-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "coral-admin"
path = "src/main.rs"

[dependencies]
database = { path = "../database" }
coral-redis = { path = "../coral-redis" }
blacklist = { path = "../blacklist" }
reqlog.workspace = true
expr.workspace = true
clients.workspace = true
hypixel.workspace = true

axum.workspace = true
tower-http = { workspace = true, features = ["compression-br", "compression-gzip"] }
tokio.workspace = true
tokio-stream = "0.1"
futures-util = "0.3"
sqlx.workspace = true
redis.workspace = true
reqwest.workspace = true
serenity.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

hex.workspace = true
base64.workspace = true
uuid.workspace = true
urlencoding = "2"
url = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
brotli-decompressor = "6"
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
