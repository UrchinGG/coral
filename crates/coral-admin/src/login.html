<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Admin</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#f3f4f6;font:14px/1.5 system-ui,sans-serif}
main{margin:16px;padding:40px;max-width:20rem;border:1px solid #ffffff1a;border-radius:8px;background:#ffffff0d;text-align:center}
h1{margin:0 0 16px;font-size:20px;font-weight:600}
p{margin:0 0 16px;color:#6b7280}
.notice{color:#f87171}
a{display:inline-block;padding:8px 16px;border-radius:4px;background:#6366f1;color:#fff;font-weight:500;text-decoration:none}
a:hover{background:#818cf8}
</style>
</head>
<body>
<main>
<h1>Coral Admin</h1>
{notice}
<p>Sign in with the Discord account registered as an owner to continue.</p>
<a href="{sign_in}">Sign in with Discord</a>
</main>
</body>
</html>
